<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">

<style>
  .title { font: 700 24px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .subtitle { font: 500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .box-title { font: 700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .box-text { font: 12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
  .small { font: 11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .line { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
  .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 18; }
  .blue { fill: #dbeafe; stroke: #2563eb; }
  .green { fill: #dcfce7; stroke: #16a34a; }
  .yellow { fill: #fef3c7; stroke: #d97706; }
  .purple { fill: #ede9fe; stroke: #7c3aed; }
  .red { fill: #fee2e2; stroke: #dc2626; }
  .cyan { fill: #cffafe; stroke: #0891b2; }
  .gray { fill: #f1f5f9; stroke: #64748b; }
  .dark { fill: #111827; stroke: #111827; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<text x="650" y="42" text-anchor="middle" class="title">网关路由与文档聚合</text>
<text x="650" y="68" text-anchor="middle" class="subtitle">develop-gateway 基于 Path 路由到各业务服务，并通过 Knife4j 聚合 OpenAPI 文档</text>

<rect x="70" y="320" width="180" height="80" rx="12" class="cyan"/>
<text x="160.0" y="346" text-anchor="middle" class="box-title">前端 / 外部调用</text>
<text x="160.0" y="368" text-anchor="middle" class="box-text">HTTP 请求</text>


<rect x="360" y="300" width="230" height="120" rx="12" class="blue"/>
<text x="475.0" y="326" text-anchor="middle" class="box-title">develop-gateway</text>
<text x="475.0" y="348" text-anchor="middle" class="box-text">Spring Cloud Gateway</text>
<text x="475.0" y="366" text-anchor="middle" class="box-text">Path 路由</text>
<text x="475.0" y="384" text-anchor="middle" class="box-text">Knife4j 文档聚合</text>

<path d="M250,360 L360,360" class="line"/>
<text x="305.0" y="354.0" text-anchor="middle" class="small">/admin-api/** / app-api/**</text>


<rect x="760" y="100" width="180" height="58" rx="12" class="purple"/>
<text x="850.0" y="126" text-anchor="middle" class="box-title">system-server</text>
<text x="850.0" y="148" text-anchor="middle" class="box-text">/system/**</text>


<rect x="1000" y="100" width="180" height="58" rx="12" class="purple"/>
<text x="1090.0" y="126" text-anchor="middle" class="box-title">infra-server</text>
<text x="1090.0" y="148" text-anchor="middle" class="box-text">/infra/**</text>


<rect x="760" y="200" width="180" height="58" rx="12" class="gray"/>
<text x="850.0" y="226" text-anchor="middle" class="box-title">member-server</text>
<text x="850.0" y="248" text-anchor="middle" class="box-text">/member/**</text>


<rect x="1000" y="200" width="180" height="58" rx="12" class="gray"/>
<text x="1090.0" y="226" text-anchor="middle" class="box-title">bpm-server</text>
<text x="1090.0" y="248" text-anchor="middle" class="box-text">/bpm/**</text>


<rect x="760" y="300" width="180" height="58" rx="12" class="gray"/>
<text x="850.0" y="326" text-anchor="middle" class="box-title">pay-server</text>
<text x="850.0" y="348" text-anchor="middle" class="box-text">/pay/**</text>


<rect x="1000" y="300" width="180" height="58" rx="12" class="gray"/>
<text x="1090.0" y="326" text-anchor="middle" class="box-title">mall 子域</text>
<text x="1090.0" y="348" text-anchor="middle" class="box-text">/product / trade</text>


<rect x="760" y="400" width="180" height="58" rx="12" class="gray"/>
<text x="850.0" y="426" text-anchor="middle" class="box-title">crm / erp</text>
<text x="850.0" y="448" text-anchor="middle" class="box-text">/crm / erp</text>


<rect x="1000" y="400" width="180" height="58" rx="12" class="gray"/>
<text x="1090.0" y="426" text-anchor="middle" class="box-title">ai / iot</text>
<text x="1090.0" y="448" text-anchor="middle" class="box-text">/ai / iot</text>


<rect x="880" y="560" width="180" height="58" rx="12" class="green"/>
<text x="970.0" y="586" text-anchor="middle" class="box-title">OpenAPI</text>
<text x="970.0" y="608" text-anchor="middle" class="box-text">/v3/api-docs</text>


<path d="M590,360 L760,129" class="line"/>

<path d="M590,360 L1000,129" class="line"/>

<path d="M590,360 L760,229" class="line"/>

<path d="M590,360 L1000,229" class="line"/>

<path d="M590,360 L760,329" class="line"/>

<path d="M590,360 L1000,329" class="line"/>

<path d="M590,360 L760,429" class="line"/>

<path d="M590,360 L1000,429" class="line"/>


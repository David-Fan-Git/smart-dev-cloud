<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">

<style>
  .title { font: 700 24px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .subtitle { font: 500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .box-title { font: 700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .box-text { font: 12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
  .small { font: 11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .line { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
  .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 18; }
  .blue { fill: #dbeafe; stroke: #2563eb; }
  .green { fill: #dcfce7; stroke: #16a34a; }
  .yellow { fill: #fef3c7; stroke: #d97706; }
  .purple { fill: #ede9fe; stroke: #7c3aed; }
  .red { fill: #fee2e2; stroke: #dc2626; }
  .cyan { fill: #cffafe; stroke: #0891b2; }
  .gray { fill: #f1f5f9; stroke: #64748b; }
  .dark { fill: #111827; stroke: #111827; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<text x="650" y="42" text-anchor="middle" class="title">登录认证与权限校验时序</text>
<text x="650" y="68" text-anchor="middle" class="subtitle">system 模块提供用户、角色、菜单、OAuth2 与 Token 能力，Security Starter 在业务请求中解析并校验上下文</text>

<rect x="60" y="110" width="130" height="55" rx="12" class="cyan"/>
<text x="125.0" y="136" text-anchor="middle" class="box-title">Client</text>
<text x="125.0" y="158" text-anchor="middle" class="box-text">前端</text>


<rect x="230" y="110" width="160" height="55" rx="12" class="blue"/>
<text x="310.0" y="136" text-anchor="middle" class="box-title">Auth API</text>
<text x="310.0" y="158" text-anchor="middle" class="box-text">system 登录接口</text>


<rect x="440" y="110" width="160" height="55" rx="12" class="green"/>
<text x="520.0" y="136" text-anchor="middle" class="box-title">Auth Service</text>
<text x="520.0" y="158" text-anchor="middle" class="box-text">OAuth2 / Token</text>


<rect x="650" y="110" width="150" height="55" rx="12" class="yellow"/>
<text x="725.0" y="136" text-anchor="middle" class="box-title">Redis</text>
<text x="725.0" y="158" text-anchor="middle" class="box-text">Token Store</text>


<rect x="850" y="110" width="170" height="55" rx="12" class="purple"/>
<text x="935.0" y="136" text-anchor="middle" class="box-title">Permission</text>
<text x="935.0" y="158" text-anchor="middle" class="box-text">角色 / 菜单</text>


<rect x="1070" y="110" width="160" height="55" rx="12" class="blue"/>
<text x="1150.0" y="136" text-anchor="middle" class="box-title">Business API</text>
<text x="1150.0" y="158" text-anchor="middle" class="box-text">业务接口</text>


<path d="M125,165 L125,690" stroke="#cbd5e1" stroke-width="1"/>
<path d="M310,165 L310,690" stroke="#cbd5e1" stroke-width="1"/>
<path d="M520,165 L520,690" stroke="#cbd5e1" stroke-width="1"/>
<path d="M725,165 L725,690" stroke="#cbd5e1" stroke-width="1"/>
<path d="M935,165 L935,690" stroke="#cbd5e1" stroke-width="1"/>
<path d="M1150,165 L1150,690" stroke="#cbd5e1" stroke-width="1"/>

<path d="M125,220 L310,220" class="line"/>
<text x="217.5" y="214.0" text-anchor="middle" class="small">1 登录请求</text>
<path d="M310,285 L520,285" class="line"/>
<text x="415.0" y="279.0" text-anchor="middle" class="small">2 校验账号密码</text>
<path d="M520,350 L935,350" class="line"/>
<text x="727.5" y="344.0" text-anchor="middle" class="small">3 查询用户角色权限</text>
<path d="M520,415 L725,415" class="line"/>
<text x="622.5" y="409.0" text-anchor="middle" class="small">4 写入 Token</text>
<path d="M520,480 L125,480" class="line"/>
<text x="322" y="470" text-anchor="middle" class="small">5 返回 Token</text>
<path d="M125,545 L1150,545" class="line"/>
<text x="637.5" y="539.0" text-anchor="middle" class="small">6 携带 Token 请求业务接口</text>
<path d="M1150,610 L725,610" class="line"/>
<text x="938" y="600" text-anchor="middle" class="small">7 读取 Token / 用户上下文</text>
<path d="M1150,665 L935,665" class="line"/>
<text x="1042" y="655" text-anchor="middle" class="small">8 校验权限</text>

</svg>

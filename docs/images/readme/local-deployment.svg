<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">

<style>
  .title { font: 700 24px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .subtitle { font: 500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .box-title { font: 700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .box-text { font: 12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
  .small { font: 11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .line { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
  .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 18; }
  .blue { fill: #dbeafe; stroke: #2563eb; }
  .green { fill: #dcfce7; stroke: #16a34a; }
  .yellow { fill: #fef3c7; stroke: #d97706; }
  .purple { fill: #ede9fe; stroke: #7c3aed; }
  .red { fill: #fee2e2; stroke: #dc2626; }
  .cyan { fill: #cffafe; stroke: #0891b2; }
  .gray { fill: #f1f5f9; stroke: #64748b; }
  .dark { fill: #111827; stroke: #111827; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="42" text-anchor="middle" class="title">本地开发部署拓扑</text>
<text x="600" y="68" text-anchor="middle" class="subtitle">默认 local profile：develop-server 端口 48080，本地关闭 Nacos 注册发现与配置中心</text>

<rect x="80" y="130" width="220" height="80" rx="12" class="cyan"/>
<text x="190.0" y="156" text-anchor="middle" class="box-title">开发者本机</text>
<text x="190.0" y="178" text-anchor="middle" class="box-text">IDE / Terminal</text>
<text x="190.0" y="196" text-anchor="middle" class="box-text">Java 17 / Maven</text>


<rect x="410" y="110" width="260" height="80" rx="12" class="blue"/>
<text x="540.0" y="136" text-anchor="middle" class="box-title">Maven</text>
<text x="540.0" y="158" text-anchor="middle" class="box-text">compile / test / package</text>


<rect x="410" y="230" width="260" height="90" rx="12" class="green"/>
<text x="540.0" y="256" text-anchor="middle" class="box-title">develop-server</text>
<text x="540.0" y="278" text-anchor="middle" class="box-text">Spring Boot</text>
<text x="540.0" y="296" text-anchor="middle" class="box-text">默认端口 48080</text>


<rect x="760" y="230" width="260" height="90" rx="12" class="blue"/>
<text x="890.0" y="256" text-anchor="middle" class="box-title">develop-gateway</text>
<text x="890.0" y="278" text-anchor="middle" class="box-text">可选启动</text>
<text x="890.0" y="296" text-anchor="middle" class="box-text">Gateway 路由</text>


<path d="M300,170 L410,150" class="line"/>

<path d="M300,170 L410,275" class="line"/>

<path d="M670,275 L760,275" class="line"/>
<text x="715.0" y="269.0" text-anchor="middle" class="small">可选转发</text>

<rect x="70" y="410" width="1060" height="220" class="section"/>
<text x="100" y="445" class="box-title">本地依赖服务</text>

<rect x="120" y="485" width="180" height="70" rx="12" class="yellow"/>
<text x="210.0" y="511" text-anchor="middle" class="box-title">MySQL</text>
<text x="210.0" y="533" text-anchor="middle" class="box-text">ruoyi-vue-pro</text>
<text x="210.0" y="551" text-anchor="middle" class="box-text">业务数据库</text>


<rect x="340" y="485" width="180" height="70" rx="12" class="yellow"/>
<text x="430.0" y="511" text-anchor="middle" class="box-title">Redis</text>
<text x="430.0" y="533" text-anchor="middle" class="box-text">127.0.0.1:6379</text>
<text x="430.0" y="551" text-anchor="middle" class="box-text">缓存 / Token / 锁</text>


<rect x="560" y="485" width="180" height="70" rx="12" class="gray"/>
<text x="650.0" y="511" text-anchor="middle" class="box-title">Nacos</text>
<text x="650.0" y="533" text-anchor="middle" class="box-text">本地默认关闭</text>
<text x="650.0" y="551" text-anchor="middle" class="box-text">可按需开启</text>


<rect x="780" y="485" width="180" height="70" rx="12" class="gray"/>
<text x="870.0" y="511" text-anchor="middle" class="box-title">MQ / XXL-Job</text>
<text x="870.0" y="533" text-anchor="middle" class="box-text">默认按需启用</text>
<text x="870.0" y="551" text-anchor="middle" class="box-text">异步 / 定时任务</text>


<path d="M540,320 L210,485" class="line"/>

<path d="M540,320 L430,485" class="line"/>

<path d="M540,320 L650,485" class="dash"/>
<path d="M540,320 L870,485" class="dash"/>

</svg>

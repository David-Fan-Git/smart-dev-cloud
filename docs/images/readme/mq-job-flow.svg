<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">

<style>
  .title { font: 700 24px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .subtitle { font: 500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .box-title { font: 700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
  .box-text { font: 12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
  .small { font: 11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
  .line { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
  .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 18; }
  .blue { fill: #dbeafe; stroke: #2563eb; }
  .green { fill: #dcfce7; stroke: #16a34a; }
  .yellow { fill: #fef3c7; stroke: #d97706; }
  .purple { fill: #ede9fe; stroke: #7c3aed; }
  .red { fill: #fee2e2; stroke: #dc2626; }
  .cyan { fill: #cffafe; stroke: #0891b2; }
  .gray { fill: #f1f5f9; stroke: #64748b; }
  .dark { fill: #111827; stroke: #111827; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="42" text-anchor="middle" class="title">消息与定时任务处理链路</text>
<text x="600" y="68" text-anchor="middle" class="subtitle">业务模块通过 MQ 解耦异步处理，通过 XXL-Job 执行定时同步、超时处理、统计刷新等任务</text>
<rect x="60" y="110" width="1080" height="260" class="section"/>
<text x="90" y="142" class="box-title">MQ 异步消息链路</text>

<rect x="110" y="185" width="180" height="60" rx="12" class="green"/>
<text x="200.0" y="211" text-anchor="middle" class="box-title">业务 Service</text>
<text x="200.0" y="233" text-anchor="middle" class="box-text">提交本地数据</text>


<rect x="370" y="185" width="180" height="60" rx="12" class="blue"/>
<text x="460.0" y="211" text-anchor="middle" class="box-title">MQ Producer</text>
<text x="460.0" y="233" text-anchor="middle" class="box-text">构造消息</text>


<rect x="630" y="185" width="200" height="60" rx="12" class="yellow"/>
<text x="730.0" y="211" text-anchor="middle" class="box-title">MQ Broker</text>
<text x="730.0" y="233" text-anchor="middle" class="box-text">RedisMQ / RabbitMQ</text>
<text x="730.0" y="251" text-anchor="middle" class="box-text">Kafka / RocketMQ</text>


<rect x="920" y="185" width="160" height="60" rx="12" class="blue"/>
<text x="1000.0" y="211" text-anchor="middle" class="box-title">MQ Consumer</text>
<text x="1000.0" y="233" text-anchor="middle" class="box-text">异步消费</text>

<path d="M290,215 L370,215" class="line"/>

<path d="M550,215 L630,215" class="line"/>

<path d="M830,215 L920,215" class="line"/>


<rect x="920" y="285" width="160" height="50" rx="12" class="green"/>
<text x="1000.0" y="311" text-anchor="middle" class="box-title">下游业务</text>
<text x="1000.0" y="333" text-anchor="middle" class="box-text">更新 / 记录 / 通知</text>

<path d="M1000,245 L1000,285" class="line"/>


<rect x="60" y="430" width="1080" height="240" class="section"/>
<text x="90" y="462" class="box-title">XXL-Job 定时任务链路</text>

<rect x="110" y="510" width="180" height="60" rx="12" class="yellow"/>
<text x="200.0" y="536" text-anchor="middle" class="box-title">XXL-Job Admin</text>
<text x="200.0" y="558" text-anchor="middle" class="box-text">调度触发</text>


<rect x="370" y="510" width="180" height="60" rx="12" class="blue"/>
<text x="460.0" y="536" text-anchor="middle" class="box-title">Executor</text>
<text x="460.0" y="558" text-anchor="middle" class="box-text">业务应用执行器</text>


<rect x="630" y="510" width="180" height="60" rx="12" class="green"/>
<text x="720.0" y="536" text-anchor="middle" class="box-title">JobHandler</text>
<text x="720.0" y="558" text-anchor="middle" class="box-text">模块 job 包</text>


<rect x="890" y="510" width="190" height="60" rx="12" class="purple"/>
<text x="985.0" y="536" text-anchor="middle" class="box-title">Service / DB / MQ</text>
<text x="985.0" y="558" text-anchor="middle" class="box-text">业务处理</text>
<text x="985.0" y="576" text-anchor="middle" class="box-text">日志回写</text>

<path d="M290,540 L370,540" class="line"/>

<path d="M550,540 L630,540" class="line"/>

<path d="M810,540 L890,540" class="line"/>

<path d="M980,570 C900,645 260,645 200,570" class="dash"/>
<text x="600" y="650" text-anchor="middle" class="small">执行结果与日志回传 XXL-Job Admin</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">infra server 分层与六边形结构</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">基础设施模块已出现 application/domain/infrastructure 分层，同时保留 service 旧目录作为迁移来源</text>
<rect x="80" y="105" width="1020" height="78" rx="12" class="blue"/>
<text x="590.0" y="129" text-anchor="middle" class="box-title">入口层 controller / websocket / job</text>
<text x="590.0" y="152" text-anchor="middle" class="box-text">管理端：配置、数据源、文件、API 日志、Redis；App：文件上传；Job：日志清理；WebSocket：消息推送</text>
<rect x="125" y="245" width="930" height="90" rx="12" class="green"/>
<text x="590.0" y="269" text-anchor="middle" class="box-title">应用层 application</text>
<text x="590.0" y="292" text-anchor="middle" class="box-text">Config / DataSourceConfig / File / FileConfig / ApiAccessLog / ApiErrorLog ApplicationService</text>
<text x="590.0" y="309" text-anchor="middle" class="box-text">负责用例编排、事务边界、查询命令对象和端口调用</text>
<rect x="165" y="400" width="850" height="105" rx="12" class="yellow"/>
<text x="590.0" y="424" text-anchor="middle" class="box-title">领域层 domain</text>
<text x="590.0" y="447" text-anchor="middle" class="box-text">config / db / file / logger / event</text>
<text x="590.0" y="464" text-anchor="middle" class="box-text">repository / valueobject / event 等领域构件目录</text>
<rect x="90" y="575" width="310" height="92" rx="12" class="purple"/>
<text x="245.0" y="599" text-anchor="middle" class="box-title">基础设施层 infrastructure</text>
<text x="245.0" y="622" text-anchor="middle" class="box-text">cache / external / messaging / persistence / rpc</text>
<text x="245.0" y="639" text-anchor="middle" class="box-text">实现仓储和外部适配</text>
<rect x="435" y="575" width="310" height="92" rx="12" class="orange"/>
<text x="590.0" y="599" text-anchor="middle" class="box-title">数据访问层 dal</text>
<text x="590.0" y="622" text-anchor="middle" class="box-text">dataobject / mysql</text>
<text x="590.0" y="639" text-anchor="middle" class="box-text">配置、文件、数据源、日志、示例表 Mapper</text>
<rect x="780" y="575" width="310" height="92" rx="12" class="cyan"/>
<text x="935.0" y="599" text-anchor="middle" class="box-title">framework 技术能力</text>
<text x="935.0" y="622" text-anchor="middle" class="box-text">文件客户端工厂</text>
<text x="935.0" y="639" text-anchor="middle" class="box-text">DB / Local / FTP / SFTP / S3</text>
<text x="935.0" y="656" text-anchor="middle" class="box-text">Monitor / RPC / Security 配置</text>
<rect x="105" y="720" width="200" height="55" rx="12" class="white"/>
<text x="205.0" y="744" text-anchor="middle" class="box-title">api</text>
<text x="205.0" y="767" text-anchor="middle" class="box-text">契约实现适配</text>
<rect x="345" y="720" width="200" height="55" rx="12" class="white"/>
<text x="445.0" y="744" text-anchor="middle" class="box-title">convert</text>
<text x="445.0" y="767" text-anchor="middle" class="box-text">VO/DTO/DO 转换</text>
<rect x="585" y="720" width="200" height="55" rx="12" class="red"/>
<text x="685.0" y="744" text-anchor="middle" class="box-title">service</text>
<text x="685.0" y="767" text-anchor="middle" class="box-text">旧服务目录 / 迁移来源</text>
<rect x="825" y="720" width="250" height="55" rx="12" class="white"/>
<text x="950.0" y="744" text-anchor="middle" class="box-title">mq / job</text>
<text x="950.0" y="767" text-anchor="middle" class="box-text">消息目录占位与日志清理任务</text>
<path d="M590,183 L590,245" class="line"/>
<text x="685" y="220" text-anchor="middle" class="small">请求 / 调度进入用例</text>
<path d="M590,335 L590,400" class="line"/>
<text x="700" y="372" text-anchor="middle" class="small">调用领域规则与仓储接口</text>
<path d="M455,505 L245,575" class="line"/>
<text x="300" y="548" text-anchor="middle" class="small">仓储实现</text>
<path d="M590,505 L590,575" class="line"/>
<text x="665" y="548" text-anchor="middle" class="small">Mapper / DO</text>
<path d="M730,505 L935,575" class="line"/>
<text x="890" y="548" text-anchor="middle" class="small">文件客户端等技术适配</text>
<path d="M245,667 L205,720" class="dash"/>
<path d="M590,667 L445,720" class="dash"/>
<path d="M590,667 L685,720" class="dash"/>
<path d="M935,667 L950,720" class="dash"/>

</svg>

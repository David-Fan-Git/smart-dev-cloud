<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">文件上传与存储选择流程</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">依据 FileController / AppFileController、FileApplicationService 与 framework/file 客户端体系整理</text>
<rect x="80" y="120" width="220" height="75" rx="12" class="blue"/>
<text x="190.0" y="144" text-anchor="middle" class="box-title">1. 调用方上传文件</text>
<text x="190.0" y="167" text-anchor="middle" class="box-text">管理端 FileController</text>
<text x="190.0" y="184" text-anchor="middle" class="box-text">AppFileController</text>
<text x="190.0" y="201" text-anchor="middle" class="box-text">或 FileApi</text>
<rect x="380" y="120" width="220" height="75" rx="12" class="green"/>
<text x="490.0" y="144" text-anchor="middle" class="box-title">2. FileApplicationService</text>
<text x="490.0" y="167" text-anchor="middle" class="box-text">校验与编排</text>
<text x="490.0" y="184" text-anchor="middle" class="box-text">创建文件记录</text>
<rect x="680" y="120" width="260" height="75" rx="12" class="green"/>
<text x="810.0" y="144" text-anchor="middle" class="box-title">3. FileConfigApplicationService</text>
<text x="810.0" y="167" text-anchor="middle" class="box-text">读取主配置</text>
<text x="810.0" y="184" text-anchor="middle" class="box-text">确定存储渠道</text>
<path d="M300,158 L380,158" class="line"/>
<path d="M600,158 L680,158" class="line"/>
<rect x="80" y="315" width="200" height="82" rx="12" class="yellow"/>
<text x="180.0" y="339" text-anchor="middle" class="box-title">DB 存储</text>
<text x="180.0" y="362" text-anchor="middle" class="box-text">DBFileClient</text>
<text x="180.0" y="379" text-anchor="middle" class="box-text">内容写入数据库</text>
<rect x="315" y="315" width="200" height="82" rx="12" class="yellow"/>
<text x="415.0" y="339" text-anchor="middle" class="box-title">本地存储</text>
<text x="415.0" y="362" text-anchor="middle" class="box-text">LocalFileClient</text>
<text x="415.0" y="379" text-anchor="middle" class="box-text">本地磁盘路径</text>
<rect x="550" y="315" width="200" height="82" rx="12" class="yellow"/>
<text x="650.0" y="339" text-anchor="middle" class="box-title">FTP / SFTP</text>
<text x="650.0" y="362" text-anchor="middle" class="box-text">FtpFileClient</text>
<text x="650.0" y="379" text-anchor="middle" class="box-text">SftpFileClient</text>
<rect x="785" y="315" width="200" height="82" rx="12" class="yellow"/>
<text x="885.0" y="339" text-anchor="middle" class="box-title">S3 兼容存储</text>
<text x="885.0" y="362" text-anchor="middle" class="box-text">S3FileClient</text>
<text x="885.0" y="379" text-anchor="middle" class="box-text">MinIO / 云厂商 S3</text>
<path d="M810,195 L180,315" class="dash"/>
<path d="M810,195 L415,315" class="dash"/>
<path d="M810,195 L650,315" class="dash"/>
<path d="M810,195 L885,315" class="dash"/>
<rect x="245" y="535" width="270" height="85" rx="12" class="purple"/>
<text x="380.0" y="559" text-anchor="middle" class="box-title">4. FileClientFactory</text>
<text x="380.0" y="582" text-anchor="middle" class="box-text">根据配置创建 / 缓存客户端</text>
<text x="380.0" y="599" text-anchor="middle" class="box-text">屏蔽具体存储差异</text>
<rect x="650" y="535" width="270" height="85" rx="12" class="orange"/>
<text x="785.0" y="559" text-anchor="middle" class="box-title">5. 持久化文件元数据</text>
<text x="785.0" y="582" text-anchor="middle" class="box-text">FileMapper / FileDO</text>
<text x="785.0" y="599" text-anchor="middle" class="box-text">记录 URL、类型、大小等信息</text>
<path d="M415,397 L380,535" class="line"/>
<path d="M650,397 L380,535" class="line"/>
<path d="M885,397 L380,535" class="line"/>
<path d="M380,620 L785,620" class="line"/>
<rect x="350" y="700" width="480" height="55" rx="12" class="white"/>
<text x="590.0" y="724" text-anchor="middle" class="box-title">6. 返回文件 URL / 文件标识</text>
<text x="590.0" y="747" text-anchor="middle" class="box-text">上层模块通过 FileApi 复用统一文件上传能力</text>
<path d="M785,620 L590,700" class="line"/>

</svg>

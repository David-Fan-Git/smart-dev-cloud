<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">配置读取与跨模块调用流程</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">system 等模块通过 infra-api 读取运行配置，infra server 负责配置查询与持久化</text>
<rect x="70" y="130" width="190" height="70" rx="12" class="white"/>
<text x="165.0" y="154" text-anchor="middle" class="box-title">业务模块</text>
<text x="165.0" y="177" text-anchor="middle" class="box-text">例如 system</text>
<text x="165.0" y="194" text-anchor="middle" class="box-text">调用 ConfigApi</text>
<rect x="330" y="125" width="210" height="80" rx="12" class="cyan"/>
<text x="435.0" y="149" text-anchor="middle" class="box-title">develop-module-infra-api</text>
<text x="435.0" y="172" text-anchor="middle" class="box-text">ConfigApi</text>
<text x="435.0" y="189" text-anchor="middle" class="box-text">稳定 DTO / 契约</text>
<rect x="610" y="125" width="220" height="80" rx="12" class="green"/>
<text x="720.0" y="149" text-anchor="middle" class="box-title">ConfigApplicationService</text>
<text x="720.0" y="172" text-anchor="middle" class="box-text">按 key 查询配置</text>
<text x="720.0" y="189" text-anchor="middle" class="box-text">校验可见性和状态</text>
<rect x="900" y="125" width="190" height="80" rx="12" class="orange"/>
<text x="995.0" y="149" text-anchor="middle" class="box-title">ConfigMapper</text>
<text x="995.0" y="172" text-anchor="middle" class="box-text">读取 infra_config</text>
<text x="995.0" y="189" text-anchor="middle" class="box-text">返回 ConfigDO</text>
<path d="M260,165 L330,165" class="line"/>
<text x="295.0" y="148" text-anchor="middle" class="small">1. getConfigValueByKey</text>
<path d="M540,165 L610,165" class="line"/>
<text x="575.0" y="148" text-anchor="middle" class="small">2. 本地/远程适配</text>
<path d="M830,165 L900,165" class="line"/>
<text x="865.0" y="148" text-anchor="middle" class="small">3. 查询数据库</text>
<path d="M900,255 L610,255" class="line"/>
<text x="755.0" y="238" text-anchor="middle" class="small">4. 返回配置值</text>
<path d="M610,335 L330,335" class="line"/>
<text x="470.0" y="318" text-anchor="middle" class="small">5. CommonResult/DTO</text>
<path d="M330,415 L165,415" class="line"/>
<text x="247.5" y="398" text-anchor="middle" class="small">6. 调用方执行业务规则</text>
<rect x="120" y="555" width="940" height="70" rx="12" class="yellow"/>
<text x="590.0" y="579" text-anchor="middle" class="box-title">典型使用场景</text>
<text x="590.0" y="602" text-anchor="middle" class="box-text">用户注册开关、用户初始化密码、文件主配置、运行时业务参数等应通过配置能力读取，不应在业务模块硬编码。</text>

</svg>

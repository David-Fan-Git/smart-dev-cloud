<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">develop-module-infra 代码思维导图</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">从模块结构、业务能力、文件体系、运维能力和维护边界理解 infra 模块</text>
<rect x="480" y="350" width="220" height="90" rx="12" class="blue"/>
<text x="590.0" y="374" text-anchor="middle" class="box-title">develop-module-infra</text>
<text x="590.0" y="397" text-anchor="middle" class="box-text">基础设施运维管理</text>
<text x="590.0" y="414" text-anchor="middle" class="box-text">平台通用能力支撑</text>
<rect x="90" y="115" width="220" height="100" rx="12" class="cyan"/>
<text x="200.0" y="139" text-anchor="middle" class="box-title">Maven 子模块</text>
<text x="200.0" y="162" text-anchor="middle" class="box-text">develop-module-infra-api</text>
<text x="200.0" y="179" text-anchor="middle" class="box-text">develop-module-infra-server</text>
<text x="200.0" y="196" text-anchor="middle" class="box-text">聚合 POM 不放业务代码</text>
<rect x="465" y="100" width="250" height="125" rx="12" class="green"/>
<text x="590.0" y="124" text-anchor="middle" class="box-title">业务能力</text>
<text x="590.0" y="147" text-anchor="middle" class="box-text">配置管理 / 数据源管理</text>
<text x="590.0" y="164" text-anchor="middle" class="box-text">文件配置 / 文件上传</text>
<text x="590.0" y="181" text-anchor="middle" class="box-text">API 访问日志 / 错误日志</text>
<text x="590.0" y="198" text-anchor="middle" class="box-text">Redis 管理 / WebSocket</text>
<rect x="855" y="115" width="230" height="100" rx="12" class="yellow"/>
<text x="970.0" y="139" text-anchor="middle" class="box-title">文件体系</text>
<text x="970.0" y="162" text-anchor="middle" class="box-text">FileClientFactory</text>
<text x="970.0" y="179" text-anchor="middle" class="box-text">DB / Local</text>
<text x="970.0" y="196" text-anchor="middle" class="box-text">FTP / SFTP / S3</text>
<text x="970.0" y="213" text-anchor="middle" class="box-text">Tika 文件类型识别</text>
<rect x="90" y="585" width="230" height="105" rx="12" class="purple"/>
<text x="205.0" y="609" text-anchor="middle" class="box-title">外部组件</text>
<text x="205.0" y="632" text-anchor="middle" class="box-text">Tenant / Security / WebSocket</text>
<text x="205.0" y="649" text-anchor="middle" class="box-text">MyBatis / Redis / RPC</text>
<text x="205.0" y="666" text-anchor="middle" class="box-text">Nacos / MQ / XXL-Job</text>
<text x="205.0" y="683" text-anchor="middle" class="box-text">文件存储组件</text>
<rect x="470" y="590" width="240" height="95" rx="12" class="orange"/>
<text x="590.0" y="614" text-anchor="middle" class="box-title">跨模块契约</text>
<text x="590.0" y="637" text-anchor="middle" class="box-text">ConfigApi</text>
<text x="590.0" y="654" text-anchor="middle" class="box-text">FileApi</text>
<text x="590.0" y="671" text-anchor="middle" class="box-text">WebSocketSenderApi</text>
<text x="590.0" y="688" text-anchor="middle" class="box-text">DTO / Enum</text>
<rect x="855" y="585" width="230" height="105" rx="12" class="red"/>
<text x="970.0" y="609" text-anchor="middle" class="box-title">维护边界</text>
<text x="970.0" y="632" text-anchor="middle" class="box-text">infra 提供平台能力</text>
<text x="970.0" y="649" text-anchor="middle" class="box-text">业务规则不上移到 infra</text>
<text x="970.0" y="666" text-anchor="middle" class="box-text">旧 service 目录逐步迁移</text>
<text x="970.0" y="683" text-anchor="middle" class="box-text">入口层不堆叠核心逻辑</text>
<path d="M480,365 L310,165" class="line"/>
<path d="M590,350 L590,225" class="line"/>
<path d="M700,365 L855,165" class="line"/>

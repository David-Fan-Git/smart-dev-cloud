<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">

<style>
  .bg { fill:#f8fafc; }
  .panel { fill:#ffffff; stroke:#dbe3ef; stroke-width:1.2; rx:18; filter:url(#shadow); }
  .soft { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1.1; rx:14; }
  .title { font:700 28px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#475569; }
  .section-title { font:700 16px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#1e293b; }
  .box-title { font:700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#64748b; }
  .tiny { font:10px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#64748b; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.6; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef3c7; stroke:#d97706; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .slate { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
  .navy { fill:#e0f2fe; stroke:#0284c7; }
</style>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="660" y="42" text-anchor="middle" class="title">业务模块接入 framework 能力流程</text>
<text x="660" y="70" text-anchor="middle" class="subtitle">从识别横向能力到声明依赖、保持业务边界、完成运行验证的标准路径</text>

<rect x="60" y="210" width="155" height="82" rx="14" class="cyan"/>
<text x="137.5" y="235" text-anchor="middle" class="box-title">1. 识别能力</text>
<text x="137.5" y="259" text-anchor="middle" class="box-text">Web / 数据 / MQ</text>
<text x="137.5" y="276" text-anchor="middle" class="box-text">租户 / 权限等</text>
<rect x="265" y="210" width="155" height="82" rx="14" class="blue"/>
<text x="342.5" y="235" text-anchor="middle" class="box-title">2. 选择 Starter</text>
<text x="342.5" y="259" text-anchor="middle" class="box-text">按职责矩阵选择</text>
<rect x="470" y="210" width="155" height="82" rx="14" class="green"/>
<text x="547.5" y="235" text-anchor="middle" class="box-title">3. 声明依赖</text>
<text x="547.5" y="259" text-anchor="middle" class="box-text">业务模块 pom.xml</text>
<rect x="675" y="210" width="155" height="82" rx="14" class="yellow"/>
<text x="752.5" y="235" text-anchor="middle" class="box-title">4. 保持边界</text>
<text x="752.5" y="259" text-anchor="middle" class="box-text">业务规则仍在模块内</text>
<rect x="880" y="210" width="155" height="82" rx="14" class="purple"/>
<text x="957.5" y="235" text-anchor="middle" class="box-title">5. 运行聚合</text>
<text x="957.5" y="259" text-anchor="middle" class="box-text">server / gateway</text>
<rect x="1085" y="210" width="155" height="82" rx="14" class="orange"/>
<text x="1162.5" y="235" text-anchor="middle" class="box-title">6. Maven 验证</text>
<text x="1162.5" y="259" text-anchor="middle" class="box-text">compile / package</text>

<path d="M215,251 L265,251" class="line"/>
<path d="M420,251 L470,251" class="line"/>
<path d="M625,251 L675,251" class="line"/>
<path d="M830,251 L880,251" class="line"/>
<path d="M1035,251 L1085,251" class="line"/>

<rect x="165" y="410" width="990" height="92" class="panel"/>
<text x="189" y="444" text-anchor="start" class="section-title">边界提示</text>
<text x="660" y="466" text-anchor="middle" class="box-text">Starter 提供横向技术能力；领域规则、应用编排、业务流程仍留在业务模块 domain / application 等边界内。</text>
<path d="M752,292 C752,350 660,365 660,410" class="dash"/>

</svg>

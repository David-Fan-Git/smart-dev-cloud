<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">

<style>
  .bg { fill:#f8fafc; }
  .panel { fill:#ffffff; stroke:#dbe3ef; stroke-width:1.2; rx:18; filter:url(#shadow); }
  .soft { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1.1; rx:14; }
  .title { font:700 28px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#475569; }
  .section-title { font:700 16px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#1e293b; }
  .box-title { font:700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#64748b; }
  .tiny { font:10px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#64748b; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.6; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef3c7; stroke:#d97706; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .slate { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
  .navy { fill:#e0f2fe; stroke:#0284c7; }
</style>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="660" y="42" text-anchor="middle" class="title">典型 Web 请求链路</text>
<text x="660" y="70" text-anchor="middle" class="subtitle">展示运行单元、Web/Security Starter、业务模块与数据状态 Starter 的协作边界</text>

<text x="120" y="130" text-anchor="middle" class="box-title">客户端</text>
<text x="330" y="130" text-anchor="middle" class="box-title">运行单元</text>
<text x="535" y="130" text-anchor="middle" class="box-title">Web Starter</text>
<text x="755" y="130" text-anchor="middle" class="box-title">Security Starter</text>
<text x="980" y="130" text-anchor="middle" class="box-title">业务模块</text>
<text x="1190" y="130" text-anchor="middle" class="box-title">数据与状态 Starter</text>

<path d="M120,155 L120,630" class="dash"/>
<path d="M330,155 L330,630" class="dash"/>
<path d="M535,155 L535,630" class="dash"/>
<path d="M755,155 L755,630" class="dash"/>
<path d="M980,155 L980,630" class="dash"/>
<path d="M1190,155 L1190,630" class="dash"/>

<path d="M120,205 L330,205" class="line"/>
<text x="225.0" y="190" text-anchor="middle" class="small">1. 发起请求</text>
<path d="M330,275 L535,275" class="line"/>
<text x="432.5" y="260" text-anchor="middle" class="small">2. Web 处理链路</text>
<path d="M535,345 L755,345" class="line"/>
<text x="645.0" y="330" text-anchor="middle" class="small">3. 安全处理</text>
<path d="M755,415 L980,415" class="line"/>
<text x="867.5" y="400" text-anchor="middle" class="small">4. 转交业务处理</text>
<path d="M980,485 L1190,485" class="line"/>
<text x="1085.0" y="470" text-anchor="middle" class="small">5. 使用基础能力</text>
<path d="M1190,555 L980,555" class="line"/>
<text x="1085.0" y="540" text-anchor="middle" class="small">6. 返回处理结果</text>
<path d="M980,610 L535,610 L120,610" class="line"/>
<text x="560" y="596" text-anchor="middle" class="small">7. 统一响应</text>

</svg>

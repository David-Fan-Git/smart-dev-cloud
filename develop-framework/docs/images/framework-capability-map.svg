<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860">

<style>
  .bg { fill:#f8fafc; }
  .panel { fill:#ffffff; stroke:#dbe3ef; stroke-width:1.2; rx:18; filter:url(#shadow); }
  .soft { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1.1; rx:14; }
  .title { font:700 28px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#475569; }
  .section-title { font:700 16px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#1e293b; }
  .box-title { font:700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#64748b; }
  .tiny { font:10px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#64748b; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.6; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef3c7; stroke:#d97706; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .slate { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
  .navy { fill:#e0f2fe; stroke:#0284c7; }
</style>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="620" y="42" text-anchor="middle" class="title">develop-framework 能力地图</text>
<text x="620" y="70" text-anchor="middle" class="subtitle">以中心辐射方式展示能力分组，便于在文档中快速定位 Starter</text>

<rect x="490" y="365" width="260" height="105" rx="14" class="blue"/>
<text x="620.0" y="390" text-anchor="middle" class="box-title">develop-framework</text>
<text x="620.0" y="414" text-anchor="middle" class="box-text">通用框架能力</text>
<text x="620.0" y="431" text-anchor="middle" class="box-text">Spring Boot Starter 聚合</text>

<rect x="95" y="120" width="235" height="105" rx="14" class="cyan"/>
<text x="212.5" y="145" text-anchor="middle" class="box-title">基础公共能力</text>
<text x="212.5" y="169" text-anchor="middle" class="box-text">develop-common</text>
<rect x="500" y="105" width="240" height="125" rx="14" class="green"/>
<text x="620.0" y="130" text-anchor="middle" class="box-title">接入与接口</text>
<text x="620.0" y="154" text-anchor="middle" class="box-text">web / security</text>
<text x="620.0" y="171" text-anchor="middle" class="box-text">websocket / rpc</text>
<rect x="910" y="120" width="235" height="105" rx="14" class="yellow"/>
<text x="1027.5" y="145" text-anchor="middle" class="box-title">数据与状态</text>
<text x="1027.5" y="169" text-anchor="middle" class="box-text">mybatis / redis / mq</text>
<rect x="95" y="630" width="235" height="105" rx="14" class="purple"/>
<text x="212.5" y="655" text-anchor="middle" class="box-title">治理与可靠性</text>
<text x="212.5" y="679" text-anchor="middle" class="box-text">env / monitor</text>
<text x="212.5" y="696" text-anchor="middle" class="box-text">protection / job</text>
<rect x="500" y="645" width="240" height="105" rx="14" class="orange"/>
<text x="620.0" y="670" text-anchor="middle" class="box-title">共享业务技术</text>
<text x="620.0" y="694" text-anchor="middle" class="box-text">biz-tenant</text>
<text x="620.0" y="711" text-anchor="middle" class="box-text">biz-data-permission / biz-ip</text>
<rect x="910" y="630" width="235" height="105" rx="14" class="red"/>
<text x="1027.5" y="655" text-anchor="middle" class="box-title">工具与测试</text>
<text x="1027.5" y="679" text-anchor="middle" class="box-text">excel / test</text>

<path d="M490,385 L330,172" class="line"/>
<path d="M620,365 L620,230" class="line"/>
<path d="M750,385 L910,172" class="line"/>
<path d="M490,450 L330,682" class="line"/>
<path d="M620,470 L620,645" class="line"/>
<path d="M750,450 L910,682" class="line"/>

</svg>

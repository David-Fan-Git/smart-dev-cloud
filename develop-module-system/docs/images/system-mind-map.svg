<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">develop-module-system 代码思维导图</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">从 Maven 子模块、业务能力、分层结构、外部组件和维护边界五个维度理解 system 模块</text>
<rect x="480" y="350" width="220" height="90" rx="12" class="blue"/>
<text x="590.0" y="374" text-anchor="middle" class="box-title">develop-module-system</text>
<text x="590.0" y="397" text-anchor="middle" class="box-text">系统管理基础域</text>
<text x="590.0" y="414" text-anchor="middle" class="box-text">支撑上层核心业务</text>
<rect x="90" y="120" width="220" height="95" rx="12" class="cyan"/>
<text x="200.0" y="144" text-anchor="middle" class="box-title">Maven 子模块</text>
<text x="200.0" y="167" text-anchor="middle" class="box-text">develop-module-system-api</text>
<text x="200.0" y="184" text-anchor="middle" class="box-text">develop-module-system-server</text>
<text x="200.0" y="201" text-anchor="middle" class="box-text">聚合 POM 不放业务代码</text>
<rect x="470" y="105" width="240" height="125" rx="12" class="green"/>
<text x="590.0" y="129" text-anchor="middle" class="box-title">业务能力</text>
<text x="590.0" y="152" text-anchor="middle" class="box-text">认证 / OAuth2 / 社交登录</text>
<text x="590.0" y="169" text-anchor="middle" class="box-text">用户 / 部门 / 岗位</text>
<text x="590.0" y="186" text-anchor="middle" class="box-text">角色 / 菜单 / 权限</text>
<text x="590.0" y="203" text-anchor="middle" class="box-text">租户 / 字典 / 日志</text>
<text x="590.0" y="220" text-anchor="middle" class="box-text">邮件 / 短信 / 通知</text>
<rect x="860" y="120" width="220" height="95" rx="12" class="yellow"/>
<text x="970.0" y="144" text-anchor="middle" class="box-title">分层结构</text>
<text x="970.0" y="167" text-anchor="middle" class="box-text">controller / application</text>
<text x="970.0" y="184" text-anchor="middle" class="box-text">domain / infrastructure</text>
<text x="970.0" y="201" text-anchor="middle" class="box-text">convert / dal / mq / job</text>
<rect x="95" y="585" width="230" height="105" rx="12" class="purple"/>
<text x="210.0" y="609" text-anchor="middle" class="box-title">外部组件</text>
<text x="210.0" y="632" text-anchor="middle" class="box-text">Security / Tenant / DataPermission</text>
<text x="210.0" y="649" text-anchor="middle" class="box-text">MyBatis / Redis / RPC</text>
<text x="210.0" y="666" text-anchor="middle" class="box-text">Nacos / MQ / XXL-Job</text>
<text x="210.0" y="683" text-anchor="middle" class="box-text">JustAuth / WeChat / Captcha</text>
<rect x="480" y="590" width="220" height="95" rx="12" class="orange"/>
<text x="590.0" y="614" text-anchor="middle" class="box-title">跨模块契约</text>
<text x="590.0" y="637" text-anchor="middle" class="box-text">DTO / Enum</text>
<text x="590.0" y="654" text-anchor="middle" class="box-text">CommonApi</text>
<text x="590.0" y="671" text-anchor="middle" class="box-text">RemoteClient</text>
<text x="590.0" y="688" text-anchor="middle" class="box-text">local / remote 适配</text>
<rect x="855" y="585" width="230" height="105" rx="12" class="red"/>
<text x="970.0" y="609" text-anchor="middle" class="box-title">维护边界</text>
<text x="970.0" y="632" text-anchor="middle" class="box-text">API 稳定优先</text>
<text x="970.0" y="649" text-anchor="middle" class="box-text">Server 承载实现</text>
<text x="970.0" y="666" text-anchor="middle" class="box-text">核心规则进入 DDD 分层</text>
<text x="970.0" y="683" text-anchor="middle" class="box-text">入口层不堆叠业务规则</text>
<path d="M480,365 L310,168" class="line"/>
<path d="M590,350 L590,230" class="line"/>
<path d="M700,365 L860,168" class="line"/>
<path d="M480,430 L325,637" class="line"/>
<path d="M590,440 L590,590" class="line"/>
<path d="M700,430 L855,637" class="line"/>

</svg>

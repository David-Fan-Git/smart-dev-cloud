<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">system server 分层与六边形结构</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">Controller 只做入口适配；Application 编排用例；Domain 表达领域上下文；Infrastructure 适配数据库、缓存、RPC、MQ 与外部服务</text>
<rect x="80" y="110" width="1020" height="75" rx="12" class="blue"/>
<text x="590.0" y="134" text-anchor="middle" class="box-title">入口层 controller</text>
<text x="590.0" y="157" text-anchor="middle" class="box-text">admin：认证、用户、部门、角色、菜单、租户、字典、日志、邮件、通知、OAuth2、短信、社交；app：字典、地区、租户</text>
<rect x="120" y="245" width="940" height="90" rx="12" class="green"/>
<text x="590.0" y="269" text-anchor="middle" class="box-title">应用层 application</text>
<text x="590.0" y="292" text-anchor="middle" class="box-text">AuthUseCase / AdminUserUseCase / RoleUseCase / PermissionUseCase / TenantUseCase / SmsUseCase ...</text>
<text x="590.0" y="309" text-anchor="middle" class="box-text">ApplicationService 负责编排事务、权限上下文、跨用例协作和外部 API 调用</text>
<rect x="160" y="400" width="860" height="105" rx="12" class="yellow"/>
<text x="590.0" y="424" text-anchor="middle" class="box-title">领域层 domain</text>
<text x="590.0" y="447" text-anchor="middle" class="box-text">auth / user / permission / tenant / dept / dict / logger / mail / notice / notify / oauth2 / sms / social / member</text>
<text x="590.0" y="464" text-anchor="middle" class="box-text">repository / service / event / valueobject / specification 等领域构件目录</text>
<rect x="120" y="575" width="440" height="95" rx="12" class="purple"/>
<text x="340.0" y="599" text-anchor="middle" class="box-title">基础设施层 infrastructure</text>
<text x="340.0" y="622" text-anchor="middle" class="box-text">cache / external / messaging / persistence / rpc</text>
<text x="340.0" y="639" text-anchor="middle" class="box-text">实现领域仓储与出站适配</text>
<rect x="620" y="575" width="440" height="95" rx="12" class="orange"/>
<text x="840.0" y="599" text-anchor="middle" class="box-title">数据访问层 dal</text>
<text x="840.0" y="622" text-anchor="middle" class="box-text">dataobject / mysql / redis</text>
<text x="840.0" y="639" text-anchor="middle" class="box-text">MyBatis Mapper、DO、Redis Key 与 OAuth2 缓存组件</text>
<rect x="120" y="720" width="220" height="55" rx="12" class="white"/>
<text x="230.0" y="744" text-anchor="middle" class="box-title">convert</text>
<text x="230.0" y="767" text-anchor="middle" class="box-text">VO / DTO / DO 转换</text>
<rect x="380" y="720" width="220" height="55" rx="12" class="white"/>
<text x="490.0" y="744" text-anchor="middle" class="box-title">api</text>
<text x="490.0" y="767" text-anchor="middle" class="box-text">模块内 API 实现适配</text>
<rect x="640" y="720" width="220" height="55" rx="12" class="white"/>
<text x="750.0" y="744" text-anchor="middle" class="box-title">mq / job</text>
<text x="750.0" y="767" text-anchor="middle" class="box-text">消息消费者与定时任务入口</text>
<rect x="900" y="720" width="160" height="55" rx="12" class="white"/>
<text x="980.0" y="744" text-anchor="middle" class="box-title">framework</text>
<text x="980.0" y="767" text-anchor="middle" class="box-text">模块配置扩展</text>
<path d="M590,185 L590,245" class="line"/>
<text x="660" y="220" text-anchor="middle" class="small">请求进入 UseCase</text>
<path d="M590,335 L590,400" class="line"/>
<text x="690" y="372" text-anchor="middle" class="small">调用领域规则 / 仓储接口</text>
<path d="M430,505 L340,575" class="line"/>
<text x="335" y="548" text-anchor="middle" class="small">仓储实现</text>
<path d="M750,505 L820,575" class="line"/>
<text x="830" y="548" text-anchor="middle" class="small">DO / Mapper</text>
<path d="M340,670 L250,720" class="dash"/>
<path d="M440,670 L490,720" class="dash"/>
<path d="M760,670 L750,720" class="dash"/>
<path d="M910,670 L980,720" class="dash"/>

</svg>

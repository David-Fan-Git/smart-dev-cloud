<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">

<style>
  .bg { fill:#f8fafc; }
  .title { font:700 26px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .subtitle { font:500 14px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .box-title { font:700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#0f172a; }
  .box-text { font:12px Arial, 'Microsoft YaHei', sans-serif; fill:#334155; }
  .small { font:11px Arial, 'Microsoft YaHei', sans-serif; fill:#475569; }
  .line { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
  .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
  .blue { fill:#dbeafe; stroke:#2563eb; }
  .green { fill:#dcfce7; stroke:#16a34a; }
  .yellow { fill:#fef9c3; stroke:#ca8a04; }
  .purple { fill:#ede9fe; stroke:#7c3aed; }
  .red { fill:#fee2e2; stroke:#dc2626; }
  .cyan { fill:#cffafe; stroke:#0891b2; }
  .orange { fill:#ffedd5; stroke:#ea580c; }
  .gray { fill:#e2e8f0; stroke:#64748b; }
  .white { fill:#ffffff; stroke:#cbd5e1; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>

<rect width="100%" height="100%" class="bg"/>

<text x="590" y="42" text-anchor="middle" class="title">后台用户创建 / 更新流程</text>
<text x="590" y="68" text-anchor="middle" class="subtitle">依据 UserController 与 AdminUserApplicationService 的用户维护逻辑整理</text>
<rect x="80" y="120" width="220" height="75" rx="12" class="blue"/>
<text x="190.0" y="144" text-anchor="middle" class="box-title">1. 管理端提交用户信息</text>
<text x="190.0" y="167" text-anchor="middle" class="box-text">用户名、手机号、邮箱</text>
<text x="190.0" y="184" text-anchor="middle" class="box-text">部门、岗位、状态</text>
<rect x="380" y="120" width="220" height="75" rx="12" class="blue"/>
<text x="490.0" y="144" text-anchor="middle" class="box-title">2. Controller 入站适配</text>
<text x="490.0" y="167" text-anchor="middle" class="box-text">参数校验</text>
<text x="490.0" y="184" text-anchor="middle" class="box-text">权限 / 操作日志注解</text>
<rect x="680" y="120" width="260" height="75" rx="12" class="green"/>
<text x="810.0" y="144" text-anchor="middle" class="box-title">3. AdminUserUseCase</text>
<text x="810.0" y="167" text-anchor="middle" class="box-text">createUser / updateUser</text>
<text x="810.0" y="184" text-anchor="middle" class="box-text">事务边界</text>
<path d="M300,158 L380,158" class="line"/>
<path d="M600,158 L680,158" class="line"/>
<rect x="120" y="300" width="230" height="85" rx="12" class="yellow"/>
<text x="235.0" y="324" text-anchor="middle" class="box-title">4. 租户账号额度校验</text>
<text x="235.0" y="347" text-anchor="middle" class="box-text">tenantService.handleTenantInfo</text>
<text x="235.0" y="364" text-anchor="middle" class="box-text">账号数不能超过套餐限制</text>
<rect x="470" y="300" width="230" height="85" rx="12" class="yellow"/>
<text x="585.0" y="324" text-anchor="middle" class="box-title">5. 唯一性与组织校验</text>
<text x="585.0" y="347" text-anchor="middle" class="box-text">用户名 / 手机 / 邮箱</text>
<text x="585.0" y="364" text-anchor="middle" class="box-text">部门 / 岗位有效性</text>
<rect x="820" y="300" width="230" height="85" rx="12" class="yellow"/>
<text x="935.0" y="324" text-anchor="middle" class="box-title">6. 密码与用户 DO</text>
<text x="935.0" y="347" text-anchor="middle" class="box-text">PasswordEncoder 加密</text>
<text x="935.0" y="364" text-anchor="middle" class="box-text">BeanUtils 转换 DO</text>
<path d="M810,195 L235,300" class="line"/>
<path d="M810,195 L585,300" class="line"/>
<path d="M810,195 L935,300" class="line"/>
<rect x="180" y="505" width="240" height="85" rx="12" class="orange"/>
<text x="300.0" y="529" text-anchor="middle" class="box-title">7. 写入用户表</text>
<text x="300.0" y="552" text-anchor="middle" class="box-text">AdminUserMapper</text>
<text x="300.0" y="569" text-anchor="middle" class="box-text">insert / updateById</text>
<rect x="470" y="505" width="240" height="85" rx="12" class="orange"/>
<text x="590.0" y="529" text-anchor="middle" class="box-title">8. 写入用户岗位关系</text>
<text x="590.0" y="552" text-anchor="middle" class="box-text">UserPostMapper</text>
<text x="590.0" y="569" text-anchor="middle" class="box-text">insertBatch / delete</text>
<rect x="760" y="505" width="240" height="85" rx="12" class="purple"/>
<text x="880.0" y="529" text-anchor="middle" class="box-title">9. 记录操作日志上下文</text>
<text x="880.0" y="552" text-anchor="middle" class="box-text">LogRecordContext</text>
<text x="880.0" y="569" text-anchor="middle" class="box-text">创建 / 更新日志</text>
<path d="M935,385 L300,505" class="line"/>
<path d="M935,385 L590,505" class="line"/>
<path d="M935,385 L880,505" class="line"/>
<rect x="300" y="690" width="580" height="65" rx="12" class="white"/>
<text x="590.0" y="714" text-anchor="middle" class="box-title">10. 返回用户 ID 或完成状态</text>
<text x="590.0" y="737" text-anchor="middle" class="box-text">上层业务可通过 system-api 的 AdminUserApi / RemoteClient 复用用户能力</text>
<path d="M300,590 L590,690" class="line"/>
<path d="M590,590 L590,690" class="line"/>
<path d="M880,590 L590,690" class="line"/>

</svg>
